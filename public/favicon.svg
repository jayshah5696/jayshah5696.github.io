      --emblem-j: #c4623a;
      --emblem-s: #d4a843;
      --emblem-bindu: #2c2416;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --emblem-bg: #15111e;
        --emblem-border: rgba(255, 255, 255, 0.14);
        --emblem-frame: rgba(232, 196, 98, 0.4);
        --emblem-j: #e07a4f;
        --emblem-s: #e8c462;
        --emblem-bindu: #e8e0d4;
      }
    }
  </style>
  <rect width="100" height="100" rx="22" fill="var(--emblem-bg)"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" fill="none" stroke="var(--emblem-border)" stroke-width="1.5"/>
