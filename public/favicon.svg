  <circle cx="92" cy="50" r="2.5" fill="var(--emblem-j)"/>
  <path d="M 26 26 H 38 V 56 C 38 68, 30 74, 20 66" stroke="var(--emblem-j)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 72 28 C 72 19, 56 19, 46 26 C 39 31, 45 41, 56 45 C 66 49, 74 57, 70 69 C 66 79, 50 80, 38 72" stroke="var(--emblem-s)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
