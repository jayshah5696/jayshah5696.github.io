<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <style>
    :root {
      --emblem-bg: #fbf5ea;
      --emblem-border: rgba(44, 36, 22, 0.15);
      --emblem-frame: rgba(196, 98, 58, 0.4);
      --emblem-j: #c4623a;
      --emblem-s: #b88a28;
      --emblem-bindu: #2c2416;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --emblem-bg: #181226;
        --emblem-border: rgba(255, 255, 255, 0.14);
        --emblem-frame: rgba(232, 196, 98, 0.35);
        --emblem-j: #ff7d52;
        --emblem-s: #fed766;
        --emblem-bindu: #fdf9f1;
      }
    }
  </style>
  <rect width="100" height="100" rx="22" fill="var(--emblem-bg)"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" fill="none" stroke="var(--emblem-border)" stroke-width="1.5"/>
  <rect x="22" y="22" width="56" height="56" rx="8" transform="rotate(45 50 50)" stroke="var(--emblem-frame)" stroke-width="2.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M 33 24 H 44 M 43 24 V 58 C 43 70 33 74 24 66" stroke="var(--emblem-j)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 74 30 C 74 20 58 20 48 28 C 42 34 46 44 56 48 C 68 52 74 60 70 70 C 66 78 48 78 38 72" stroke="var(--emblem-s)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="50" cy="50" r="5.5" fill="var(--emblem-bindu)"/>
</svg>
